name: Tumblr anmelden

# Einmalig: erst ohne Verifier starten (liefert den Freigabe-Link),
# nach „Allow“ erneut starten und die Adresse aus der Adresszeile als Verifier einfügen.
on:
  workflow_dispatch:
    inputs:
      verifier:
        description: "Leer lassen für Schritt 1. Für Schritt 2: Adresse nach „Allow“ einfügen"
        required: false
        default: ""

jobs:
  anmelden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          TUMBLR_CONSUMER_KEY: ${{ secrets.TUMBLR_CONSUMER_KEY }}
          TUMBLR_CONSUMER_SECRET: ${{ secrets.TUMBLR_CONSUMER_SECRET }}
          TUMBLR_REQ_TOKEN: ${{ secrets.TUMBLR_REQ_TOKEN }}
          TUMBLR_REQ_SECRET: ${{ secrets.TUMBLR_REQ_SECRET }}
          GH_PAT: ${{ secrets.GH_PAT }}
          VERIFIER: ${{ inputs.verifier }}
        run: |
          echo "::add-mask::$VERIFIER"
          python scripts/tumblr_anmelden.py --verifier "$VERIFIER"
