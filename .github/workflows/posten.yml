name: Posten

on:
  schedule:
    - cron: "7 * * * *"      # jede Stunde, 7 Minuten nach
  workflow_dispatch:
    inputs:
      modus:
        description: "normal, probe, trocken oder sofort"
        default: "normal"
        type: choice
        options: [normal, probe, trocken, sofort]
      id:
        description: "Beitrags-ID für den Modus sofort (z. B. roll20)"
        required: false

permissions:
  contents: write

concurrency:
  group: posten
  cancel-in-progress: false

jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Beiträge senden
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
          BSKY_DE_HANDLE: ${{ secrets.BSKY_DE_HANDLE }}
          BSKY_DE_PASSWORD: ${{ secrets.BSKY_DE_PASSWORD }}
          BSKY_EN_HANDLE: ${{ secrets.BSKY_EN_HANDLE }}
          BSKY_EN_PASSWORD: ${{ secrets.BSKY_EN_PASSWORD }}
          MASTODON_DE_INSTANCE: ${{ secrets.MASTODON_DE_INSTANCE }}
          MASTODON_DE_TOKEN: ${{ secrets.MASTODON_DE_TOKEN }}
          MASTODON_EN_INSTANCE: ${{ secrets.MASTODON_EN_INSTANCE }}
          MASTODON_EN_TOKEN: ${{ secrets.MASTODON_EN_TOKEN }}
          DISCORD_DE_WEBHOOK: ${{ secrets.DISCORD_DE_WEBHOOK }}
          DISCORD_EN_WEBHOOK: ${{ secrets.DISCORD_EN_WEBHOOK }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          MODUS: ${{ github.event.inputs.modus || 'normal' }}
          POST_ID: ${{ github.event.inputs.id }}
        run: |
          case "$MODUS" in
            probe)   python scripts/post.py --probe ;;
            trocken) python scripts/post.py --trocken ;;
            sofort)  python scripts/post.py --sofort "$POST_ID" ;;
            *)       python scripts/post.py ;;
          esac
      - name: Stand sichern
        if: always()
        run: |
          git config user.name "odin-werbung"
          git config user.email "actions@users.noreply.github.com"
          git add state/gepostet.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Stand: gepostete Beiträge"
          git pull --rebase --autostash && git push
