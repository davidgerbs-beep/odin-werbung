name: Plan prüfen

# Läuft bei jeder Änderung an Plan, Konfiguration oder Bildern und baut fehlende Karten nach.
on:
  push:
    paths: ["posts/**", "config.yaml", "werkzeug/**"]
  workflow_dispatch:

permissions:
  contents: write

# Mehrere Commits kurz hintereinander: nur der neueste Lauf zählt, ältere werden abgebrochen statt rot.
concurrency:
  group: plan-pruefen
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bildkarten bauen
        run: python werkzeug/karten.py
      - name: Karten einchecken, falls neu
        run: |
          git config user.name "odin-werbung"
          git config user.email "actions@users.noreply.github.com"
          git add bilder
          if ! git diff --cached --quiet; then
            git commit -m "Bildkarten aktualisiert"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
      - name: Plan prüfen
        run: python scripts/post.py --probe
