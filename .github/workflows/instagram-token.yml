name: Instagram-Token verlängern

# Instagram-Tokens laufen nach 60 Tagen ab. Einmal pro Woche verlängern.
on:
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

jobs:
  auffrischen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/post.py --ig-token-auffrischen
