name: IndexNow melden

# Meldet neue oder geänderte Seiten der Website an Bing und andere IndexNow-Suchmaschinen.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  melden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Geänderte Seiten melden
        run: python scripts/indexnow.py
      - name: Stand sichern
        if: always()
        run: |
          git config user.name "odin-werbung"
          git config user.email "actions@users.noreply.github.com"
          git add state/indexnow.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Stand: IndexNow"
          git pull --rebase --autostash && git push
