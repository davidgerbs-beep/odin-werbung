    de: "WEISS: Beobachtung.\nGRAU: Ermittlung.\nROT: Sofortiges Eingreifen.\nSCHWARZ: Offiziell nicht existent."
    en: "WHITE: Observation.\nGREY: Investigation.\nRED: Immediate action.\nBLACK: Officially does not exist."
    quelle_de: "Die Farben der Akten"
    quelle_en: "The colours of the files"
    alt_de: "Texttafel: Die vier Aktenfarben von O.D.I.N. Weiß für Beobachtung, Grau für Ermittlung, Rot für sofortiges Eingreifen, Schwarz für offiziell nicht existent."
    alt_en: "Text card: the four file colours of O.D.I.N. White for observation, grey for investigation, red for immediate action, black for officially does not exist."
  de:
    text: |
      Jeder Einsatz bei O.D.I.N. beginnt mit einer Akte, und das Erste, worauf ein Agent schaut, ist die Farbe.

      Die meisten Einsätze beginnen grau. Umgestuft wird öfter, als den Agenten lieb ist.
    mehr: |
      Wer eine Schwarze Akte in der Hand hält, erfährt meistens nicht, warum.
    link: https://odin-rpg.pages.dev/buecher.html
  en:
    text: |
      Every O.D.I.N. mission starts with a file, and the first thing an agent checks is its colour.

      Most missions start grey. Files get upgraded more often than the agents would like.
    mehr: |
      Whoever holds a Black File usually never learns why.
    link: https://odin-rpg.pages.dev/en/books.html

