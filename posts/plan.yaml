    alt_en: "Sepia photo of a woman in a trench coat reading a file in front of a pinboard covered in photos."
  de:
    text: |
      Die Spurenleser. Jeder Hort von O.D.I.N. hat eine Wand voller Fotos und roter Fäden, und die Wand gehört ihnen.

      Klassenbuch Investigator. Preis: Verdacht.
    link: https://odin-rpg.pages.dev/buecher.html
  en:
    text: |
      The trace readers. Every O.D.I.N. Hold has a Wall covered in photos and red string, and the Wall belongs to them.

      Class Book Investigator. Price: Suspicion.
    link: https://odin-rpg.pages.dev/en/books.html

- id: w07-preis
  tag: 44
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Psion: Resonanz\nThaumaturg: Flüstern\nSoldier: Nachhall\nAgent: Schwund\nScientist: Kontamination\nInvestigator: Verdacht"
    en: "Psion: Resonance\nThaumaturge: Whisper\nSoldier: Echo\nAgent: Fade\nScientist: Contamination\nInvestigator: Suspicion"
    quelle_de: "Jeder Zweig zahlt"
    quelle_en: "Every branch pays"
    alt_de: "Texttafel mit den sechs Klassen von O.D.I.N. und ihrem jeweiligen Preis."
    alt_en: "Text card listing the six O.D.I.N. classes and the price each one pays."
  de:
    text: |
      In O.D.I.N. riskiert jeder Wurf mehr als Lebenspunkte. Jede Klasse hat einen eigenen Preis, der sich über die Kampagne aufbaut.

      Der Psion hört irgendwann zu viel. Der Agent weiß irgendwann nicht mehr, wer er war.
    link: https://odin-rpg.pages.dev/
    tags: ["Spieldesign"]
  en:
    text: |
      In O.D.I.N. every roll risks more than hit points. Each class has its own price, and it builds up over a campaign.

      The Psion eventually hears too much. The Agent eventually forgets who they were.
    link: https://odin-rpg.pages.dev/en/
    tags: ["TTRPGDesign"]

- id: w07-graue-akten
  tag: 47
  zeit: "10:30"
  zeit_en: "17:00"
  bild:
    typ: cover
    de: cover_ODIN_14_Graue_Akten.jpg
    en: cover_ODIN_EN_14_Grey_Files.jpg
    alt_de: "Cover von Graue Akten: Bleistiftzeichnung einer Frau, die im Gehen in einer Akte liest."
    alt_en: "Cover of Grey Files: pencil drawing of a woman reading a file as she walks."
  de:
    text: |
      Die meisten Einsätze beginnen grau. Graue Akten sind acht davon, fertig für die Spielleitung, mit eigenem Handout-Heft.

      Für alle, die keine Zeit haben, jede Woche einen Einsatz zu schreiben.
    link: https://odin-rpg.pages.dev/buecher.html
    tags: ["Spielleitung"]
  en:
    text: |
      Most missions start grey. Grey Files collects eight of them, ready to run, with their own handout booklet.

      For every GM who doesn't have time to write a mission every week.
    link: https://odin-rpg.pages.dev/en/books.html
    tags: ["GameMaster"]

# ---------------- Woche 8 ----------------
- id: w08-gefunden
  tag: 49
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Man tritt O.D.I.N. nicht bei.\nMan wird gefunden."
    en: "You don't join O.D.I.N.\nYou get found."
    quelle_de: "Was es heißt, Agent zu sein"
    quelle_en: "What it means to be an agent"
    alt_de: "Texttafel: Man tritt O.D.I.N. nicht bei. Man wird gefunden."
    alt_en: "Text card: You don't join O.D.I.N. You get found."
  de:
    text: |
      Irgendwann klopft jemand an die Tür, oft dann, wenn das alte Leben ohnehin in Trümmern liegt. Das Angebot: Wissen gegen Freiheit.

      Wer ablehnt, erinnert sich am nächsten Morgen an nichts. Behaupten jedenfalls die Anwerber.
    link: https://odin-rpg.pages.dev/generator/
  en:
    text: |
      One day someone knocks on the door, usually when the old life is already in ruins. The offer: knowledge for freedom.

      Those who refuse remember nothing the next morning. Or so the recruiters claim.
    link: https://odin-rpg.pages.dev/generator/en/

- id: w08-zellen
  tag: 51
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Eine Zelle kennt ihre Mitglieder unter Codenamen, ihren Führungsoffizier und ihren Stützpunkt.\n\nMehr nicht."
    en: "A cell knows its members by codename, its handler and its base.\n\nNothing more."
    quelle_de: "Zellen und Horte"
    quelle_en: "Cells and Holds"
    alt_de: "Texttafel: Eine Zelle kennt ihre Mitglieder unter Codenamen, ihren Führungsoffizier und ihren Stützpunkt. Mehr nicht."
    alt_en: "Text card: A cell knows its members by codename, its handler and its base. Nothing more."
  de:
    text: |
      Seit dem Verrat von 1989 arbeitet O.D.I.N. in Zellen aus drei bis sechs Agenten verschiedener Zweige. Die Zelle ist eure Spielgruppe.

      Ein guter Führungsoffizier schützt seine Zelle. Ein schlechter opfert sie.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      Since the betrayal of 1989, O.D.I.N. works in cells of three to six agents from different branches. The cell is your gaming group.

      A good handler protects the cell. A bad one sacrifices it.
    link: https://odin-rpg.pages.dev/en/

- id: w08-andere-dienste
  tag: 54
  zeit: "10:30"
  zeit_en: "17:00"
  bild:
    typ: cover
    de: cover_ODIN_15_Die_anderen_Dienste.jpg
    en: cover_ODIN_EN_15_The_Other_Services.jpg
    alt_de: "Cover von Die anderen Dienste: Bleistiftzeichnung eines Mannes mit Schiebermütze und langem Mantel, der über die Schulter blickt."
    alt_en: "Cover of The Other Services: pencil drawing of a man in a flat cap and long coat looking over his shoulder."
  de:
    text: |
      O.D.I.N. ist nicht allein im Schatten. Die anderen Dienste stellt der Spielleitung Gegenspieler und Rivalen vor, die dieselben Risse wollen, nur aus anderen Gründen.

      Manchmal ist der gefährlichste Gegner einer mit Dienstausweis.
    link: https://odin-rpg.pages.dev/buecher.html
    tags: ["Spielleitung"]
  en:
    text: |
      O.D.I.N. isn't alone in the shadows. The Other Services gives the GM rivals and opponents who want the same rifts for different reasons.

      Sometimes the most dangerous enemy carries a government ID.
    link: https://odin-rpg.pages.dev/en/books.html
    tags: ["GameMaster"]

# ---------------- Woche 9 ----------------
- id: w09-grauen
  tag: 56
  zeit: "18:00"
  bild:
    typ: zitat
    de: "O.D.I.N. hat Psychologen, Medikamente und Rituale dagegen.\n\nKeines davon hilft immer."
    en: "O.D.I.N. has psychologists, medication and rituals for it.\n\nNone of them always works."
    quelle_de: "Über das Grauen"
    quelle_en: "On horror"
    alt_de: "Texttafel: O.D.I.N. hat Psychologen, Medikamente und Rituale dagegen. Keines davon hilft immer."
    alt_en: "Text card: O.D.I.N. has psychologists, medication and rituals for it. None of them always works."
  de:
    text: |
      Menschen sind nicht dafür gemacht, das Unmögliche zu sehen. In O.D.I.N. bleibt es nicht bei Wunden: Belastung und Trauma laufen mit, und sie gehen nach dem Einsatz nicht einfach weg.
    link: https://odin-rpg.pages.dev/
    tags: ["Horror"]
  en:
    text: |
      People aren't made to see the impossible. In O.D.I.N. it doesn't stop at wounds: strain and trauma are tracked too, and they don't just go away after the mission.
    link: https://odin-rpg.pages.dev/en/
    tags: ["HorrorRPG"]

- id: w09-horte
  tag: 58
  zeit: "18:00"
  bild:
    typ: cover
    de: cover_ODIN_16_Horte_der_Welt.jpg
    alt_de: "Cover von Horte der Welt: Bleistiftzeichnung eines Mannes im Mantel, der auf eine gewölbte Tür in einer Mauer zugeht."
  de:
    text: |
      Kein Stützpunkt von O.D.I.N. beherbergt mehr als zwölf Agenten. Horte der Welt zeigt, wo sie liegen, unter welchen Städten und hinter welchen Türen.

      Der Regionalband, neu und kostenlos.
    link: https://odin-rpg.pages.dev/buecher.html

- id: w09-kostenlos
  tag: 61
  zeit: "10:30"
  zeit_en: "17:00"
  bild:
    typ: raster
    dateien: [klasse-psion.webp, klasse-thaumaturg.webp, klasse-soldier.webp, klasse-agent.webp, klasse-scientist.webp, klasse-investigator.webp]
    zeile_de: "Sechs Zweige. Kein Preisschild."
    zeile_en: "Six branches. No price tag."
    alt_de: "Raster aus sechs Sepia-Porträts, je eines für die sechs Klassen von O.D.I.N."
    alt_en: "Grid of six sepia portraits, one for each of the six O.D.I.N. classes."
  de:
    text: |
      Oft gefragt: warum ist O.D.I.N. kostenlos?

      Weil ich will, dass es gespielt wird. Wer trotzdem etwas zurückgeben möchte, findet auf der Seite einen PayPal-Link. Noch lieber ist mir ein Bericht von eurer Runde.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      People ask why O.D.I.N. is free.

      Because I want it played. If you'd like to give something back, there's a PayPal link on the site. A report from your table means even more to me.
    link: https://odin-rpg.pages.dev/en/

# ---------------- Woche 10 ----------------
