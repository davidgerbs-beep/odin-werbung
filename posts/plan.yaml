  de:
    text: |
      Zwischen den Einsätzen leben O.D.I.N.-Agenten unter Tarnidentität in ganz normalen Wohnungen.

      Diese Lüge aufrechtzuerhalten, ist oft schwerer als jeder Einsatz. Und sie gibt am Tisch mehr Szenen her als jedes Monster.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      Between missions, O.D.I.N. agents live under cover in perfectly normal flats.

      Keeping that lie going is often harder than any mission. At the table it produces more scenes than any monster.
    link: https://odin-rpg.pages.dev/en/

