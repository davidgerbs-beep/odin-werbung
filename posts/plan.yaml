      For every GM who doesn't have time to write a mission every week.
    link: https://odin-rpg.pages.dev/en/books.html
    tags: ["GameMaster"]

# ---------------- Woche 8 ----------------
- id: w08-gefunden
  tag: 49
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Man tritt O.D.I.N. nicht bei.\nMan wird gefunden."
    en: "You don't join O.D.I.N.\nYou get found."
    quelle_de: "Was es heißt, Agent zu sein"
    quelle_en: "What it means to be an agent"
    alt_de: "Texttafel: Man tritt O.D.I.N. nicht bei. Man wird gefunden."
    alt_en: "Text card: You don't join O.D.I.N. You get found."
  de:
    text: |
      Irgendwann klopft jemand an die Tür, oft dann, wenn das alte Leben ohnehin in Trümmern liegt. Das Angebot: Wissen gegen Freiheit.

      Wer ablehnt, erinnert sich am nächsten Morgen an nichts. Behaupten jedenfalls die Anwerber.
    link: https://odin-rpg.pages.dev/generator/
  en:
    text: |
      One day someone knocks on the door, usually when the old life is already in ruins. The offer: knowledge for freedom.

      Those who refuse remember nothing the next morning. Or so the recruiters claim.
    link: https://odin-rpg.pages.dev/generator/en/

- id: w08-zellen
  tag: 51
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Eine Zelle kennt ihre Mitglieder unter Codenamen, ihren Führungsoffizier und ihren Stützpunkt.\n\nMehr nicht."
    en: "A cell knows its members by codename, its handler and its base.\n\nNothing more."
    quelle_de: "Zellen und Horte"
    quelle_en: "Cells and Holds"
    alt_de: "Texttafel: Eine Zelle kennt ihre Mitglieder unter Codenamen, ihren Führungsoffizier und ihren Stützpunkt. Mehr nicht."
    alt_en: "Text card: A cell knows its members by codename, its handler and its base. Nothing more."
  de:
    text: |
      Seit dem Verrat von 1989 arbeitet O.D.I.N. in Zellen aus drei bis sechs Agenten verschiedener Zweige. Die Zelle ist eure Spielgruppe.

      Ein guter Führungsoffizier schützt seine Zelle. Ein schlechter opfert sie.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      Since the betrayal of 1989, O.D.I.N. works in cells of three to six agents from different branches. The cell is your gaming group.

      A good handler protects the cell. A bad one sacrifices it.
    link: https://odin-rpg.pages.dev/en/

- id: w08-andere-dienste
  tag: 54
  zeit: "10:30"
  zeit_en: "17:00"
  bild:
    typ: cover
    de: cover_ODIN_15_Die_anderen_Dienste.jpg
    en: cover_ODIN_EN_15_The_Other_Services.jpg
    alt_de: "Cover von Die anderen Dienste: eine Parkbank unter einer Laterne bei Nacht, darauf eine zurückgelassene Aktentasche, in Sepia."
    alt_en: "Cover of The Other Services: a park bench under a street lamp at night with an abandoned briefcase on it, in sepia."
  de:
    text: |
      O.D.I.N. ist nicht allein im Schatten. Die anderen Dienste stellt der Spielleitung Gegenspieler und Rivalen vor, die dieselben Risse wollen, nur aus anderen Gründen.

      Manchmal ist der gefährlichste Gegner einer mit Dienstausweis.
    link: https://odin-rpg.pages.dev/buecher.html
    tags: ["Spielleitung"]
  en:
    text: |
      O.D.I.N. isn't alone in the shadows. The Other Services gives the GM rivals and opponents who want the same rifts for different reasons.

      Sometimes the most dangerous enemy carries a government ID.
    link: https://odin-rpg.pages.dev/en/books.html
    tags: ["GameMaster"]

# ---------------- Woche 9 ----------------
- id: w09-grauen
  tag: 56
  zeit: "18:00"
  bild:
    typ: zitat
    de: "O.D.I.N. hat Psychologen, Medikamente und Rituale dagegen.\n\nKeines davon hilft immer."
    en: "O.D.I.N. has psychologists, medication and rituals for it.\n\nNone of them always works."
    quelle_de: "Über das Grauen"
    quelle_en: "On horror"
    alt_de: "Texttafel: O.D.I.N. hat Psychologen, Medikamente und Rituale dagegen. Keines davon hilft immer."
    alt_en: "Text card: O.D.I.N. has psychologists, medication and rituals for it. None of them always works."
  de:
    text: |
      Menschen sind nicht dafür gemacht, das Unmögliche zu sehen. In O.D.I.N. bleibt es nicht bei Wunden: Belastung und Trauma laufen mit, und sie gehen nach dem Einsatz nicht einfach weg.
    link: https://odin-rpg.pages.dev/
    tags: ["Horror"]
  en:
    text: |
      People aren't made to see the impossible. In O.D.I.N. it doesn't stop at wounds: strain and trauma are tracked too, and they don't just go away after the mission.
    link: https://odin-rpg.pages.dev/en/
    tags: ["HorrorRPG"]

- id: w09-horte
  tag: 58
  zeit: "18:00"
  bild:
    typ: cover
