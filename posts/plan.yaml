- id: w05-risse
  tag: 30
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Risse riechen nach Ozon und nassem Stein.\n\nWer diesen Geruch einmal wahrgenommen hat, vergisst ihn nicht."
    en: "Rifts smell of ozone and wet stone.\n\nAnyone who has smelled it once never forgets it."
    quelle_de: "O.D.I.N. Schnellstart"
    quelle_en: "O.D.I.N. Quickstart"
    alt_de: "Texttafel: Risse riechen nach Ozon und nassem Stein. Wer diesen Geruch einmal wahrgenommen hat, vergisst ihn nicht."
    alt_en: "Text card: Rifts smell of ozone and wet stone. Anyone who has smelled it once never forgets it."
  de:
    text: |
      Manche Risse schließen sich nach Sekunden. Andere bleiben jahrelang offen: Uhren gehen falsch, Pflanzen wachsen in falschen Farben, Menschen träumen dieselben Träume.

      Darum geht es in O.D.I.N.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      Some rifts close after seconds. Others stay open for years: clocks run wrong, plants grow in the wrong colours, people dream the same dreams.

      That is what O.D.I.N. is about.
    link: https://odin-rpg.pages.dev/en/

- id: w05-spielleiterbuch
  tag: 33
  zeit: "10:30"
  zeit_en: "17:00"
