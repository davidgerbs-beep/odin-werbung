- id: w05-risse
  tag: 30
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Risse riechen nach Ozon und nassem Stein.\n\nWer diesen Geruch einmal wahrgenommen hat, vergisst ihn nicht."
    en: "Rifts smell of ozone and wet stone.\n\nAnyone who has smelled it once never forgets it."
    quelle_de: "O.D.I.N. Schnellstart"
    quelle_en: "O.D.I.N. Quickstart"
    alt_de: "Texttafel: Risse riechen nach Ozon und nassem Stein. Wer diesen Geruch einmal wahrgenommen hat, vergisst ihn nicht."
    alt_en: "Text card: Rifts smell of ozone and wet stone. Anyone who has smelled it once never forgets it."
  de:
    text: |
      Manche Risse schließen sich nach Sekunden. Andere bleiben jahrelang offen: Uhren gehen falsch, Pflanzen wachsen in falschen Farben, Menschen träumen dieselben Träume.

      Darum geht es in O.D.I.N.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      Some rifts close after seconds. Others stay open for years: clocks run wrong, plants grow in the wrong colours, people dream the same dreams.

      That is what O.D.I.N. is about.
    link: https://odin-rpg.pages.dev/en/

- id: w05-spielleiterbuch
  tag: 33
  zeit: "10:30"
  zeit_en: "17:00"
  bild:
    typ: cover
    de: cover_ODIN_08_Spielleiterbuch.jpg
    en: cover_ODIN_EN_08_Game_Masters_Book.jpg
    alt_de: "Cover des Spielleiterbuchs: Bleistiftzeichnung eines Mannes mit Hut, Mantel und Laterne vor einer Kompassrose."
    alt_en: "Cover of the Game Master's Book: pencil drawing of a man with hat, coat and lantern in front of a compass rose."
  de:
    text: |
      Im Spielleiterbuch von O.D.I.N. kommt nicht alles aus den Rissen. Acht Ursprünge: Stimme, Fremde, Verwandelte, Alte, Tote, Maschine, Menschen, Verschobene.

      Die Spieler wissen am Anfang nie, womit sie es zu tun haben. Das ist der Sinn.
    link: https://odin-rpg.pages.dev/buecher.html
    tags: ["Spielleitung"]
  en:
    text: |
      Not everything in the O.D.I.N. Game Master's Book comes through the rifts. Eight origins: voices, aliens, mutants, cryptids, hauntings, machines, humans and displaced things.

      Players never know at the start what they are facing.
    link: https://odin-rpg.pages.dev/en/books.html
    tags: ["GameMaster"]

