    text: |
      In O.D.I.N. every roll risks more than hit points. Each class has its own price, and it builds up over a campaign.

      The Psion eventually hears too much. The Agent eventually forgets who they were.
    link: https://odin-rpg.pages.dev/en/
    tags: ["TTRPGDesign"]

