- id: w10-familie
  tag: 65
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Viele Agenten haben Familie, die glaubt, sie arbeiteten für eine Versicherung, eine Reederei oder eine Behörde mit langweiligem Namen."
    en: "Many agents have families who believe they work for an insurance company, a shipping firm or an agency with a boring name."
    quelle_de: "Was es heißt, Agent zu sein"
    quelle_en: "What it means to be an agent"
    alt_de: "Texttafel über Agenten, deren Familien glauben, sie arbeiteten für eine Versicherung oder eine Reederei."
    alt_en: "Text card about agents whose families believe they work for an insurance company or a shipping firm."
  de:
    text: |
      Zwischen den Einsätzen leben O.D.I.N.-Agenten unter Tarnidentität in ganz normalen Wohnungen.

      Diese Lüge aufrechtzuerhalten, ist oft schwerer als jeder Einsatz. Und sie gibt am Tisch mehr Szenen her als jedes Monster.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      Between missions, O.D.I.N. agents live under cover in perfectly normal flats.

      Keeping that lie going is often harder than any mission. At the table it produces more scenes than any monster.
    link: https://odin-rpg.pages.dev/en/

