  zeit_en: "20:00"
  bild:
    typ: zitat
    de: "Neu am O.D.I.N.-Spieltisch\n\nDie Wand mit roten Fäden\nGeschwärzte Akten\nGrauen nur für einen"
    en: "New at the O.D.I.N. table\n\nThe wall with red string\nRedacted files\nHorror for one player"
    quelle_de: "odin-rpg.pages.dev/tisch"
    quelle_en: "odin-rpg.pages.dev/tisch"
    alt_de: "Texttafel: Neu am O.D.I.N.-Spieltisch sind die Wand mit roten Fäden, geschwärzte Akten und Grauen, das nur ein Agent sieht."
    alt_en: "Text card: new at the O.D.I.N. table are the wall with red string, redacted files, and horror only one agent sees."
  de:
    text: |
      Neu am Spieltisch im Browser: die Wand. Notizen und Fotos hängen nebeneinander, rote Fäden verbinden, was zusammengehört.
    mehr: |
      Die Spielleitung teilt Akten geschwärzt aus und deckt die Balken auf, sobald die Agenten etwas herausfinden. Und das Grauen zeigt sich nur auf dem Bildschirm des Agenten, den es trifft. Wem das zu viel wird, stellt die Effekte auf schwach oder aus. Kostenlos, ohne Konto.
    link: https://odin-rpg.pages.dev/tisch/
    tags: ["VTT"]
  en:
    text: |
      New at the browser table: the wall. Notes and photos pinned side by side, red string between whatever belongs together.
    mehr: |
      The GM hands out redacted files and lifts the black bars as the agents find things out. And the horror only shows on the screen of the agent it hits. Too much? Set the effects to low or off. Free, no account.
    link: https://odin-rpg.pages.dev/tisch/?lang=en
    tags: ["VTT"]

