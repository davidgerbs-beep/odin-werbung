  de:
    text: |
      Sechs Zweige, 30 Subklassen. Welchen würdet ihr als Erstes spielen?

      Psion, Thaumaturg, Soldier, Agent, Scientist oder Investigator. Ich tippe auf den Psion.
    link: https://odin-rpg.pages.dev/generator/
  en:
    text: |
      Six branches, 30 subclasses. Which would you play first?

      Psion, Thaumaturge, Soldier, Agent, Scientist or Investigator. My bet is on the Psion.
    link: https://odin-rpg.pages.dev/generator/en/

# ---------------- Woche 11 ----------------
- id: w11-tunguska
  tag: 70
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Der erste dokumentierte Riss trägt in den Akten die Bezeichnung T-08: das Ereignis an der Tunguska, 1908.\n\nSeit 2011 steigt die Zahl der gemeldeten Risse sprunghaft an."
    en: "The first documented rift is filed as T-08: the Tunguska event, 1908.\n\nSince 2011 the number of reported rifts has risen sharply."
    quelle_de: "Die Risse"
    quelle_en: "The rifts"
    alt_de: "Texttafel: Der erste dokumentierte Riss heißt T-08, das Tunguska-Ereignis 1908. Seit 2011 steigt die Zahl der Risse sprunghaft."
    alt_en: "Text card: The first documented rift is T-08, the Tunguska event of 1908. Since 2011 the number of rifts has risen sharply."
  de:
    text: |
      In O.D.I.N. hat die Geschichte ein Aktenzeichen. Tunguska ist T-08, und intern stuft der Rat die Lage als anhaltende Eskalation ein.

      Deshalb erleben viele Kadetten ihren ersten Einsatz vor der Prüfung.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      In O.D.I.N., history has a file number. Tunguska is T-08, and internally the Council rates the situation as ongoing escalation.

      That's why many cadets see their first mission before their final exam.
    link: https://odin-rpg.pages.dev/en/

