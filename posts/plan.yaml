    de: "Neu am Spieltisch\n\nRaumtexte an der Karte\nKampf rechnet selbst\nFernsehansicht\nEinsatzbericht als Datei\nGeräusche auf der Karte"
    en: "New at the O.D.I.N. table\n\nRoom texts on the map\nCombat does the maths\nA view for the TV\nMission report as a file\nSounds at map locations"
    quelle_de: "odin-rpg.pages.dev/tisch"
