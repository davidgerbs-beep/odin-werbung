# O.D.I.N. Redaktionsplan
#
# tag:    Tage nach "start" aus config.yaml (0 = Starttag, ein Montag)
# datum:  alternativ festes Datum (JJJJ-MM-TT), z. B. für Halloween
# zeit:   Uhrzeit für DE (Europe/Berlin); EN geht zur Uhrzeit "zeit_en"
#         oder zur Standard-EN-Zeit aus config.yaml
# bild:   typ cover | foto | zitat | raster, wird von werkzeug/karten.py gebaut
# de/en:  text (kurz, passt auf Bluesky), mehr (nur Mastodon, Discord, Instagram),
#         link, tags (zusätzlich zu den Kanal-Tags)
# wartet_auf: Beitrag bleibt liegen, bis die Zeile gelöscht wird
# braucht:    Beitrag geht nur raus, wenn der Wert in config.yaml gesetzt ist

posts:

# ---------------- Woche 1 ----------------
- id: w01-willkommen
  tag: 0
  zeit: "18:00"
  bild:
    typ: cover
    de: cover_ODIN_01_Grundregelwerk.jpg
    en: cover_ODIN_EN_01_Core_Rulebook.jpg
    alt_de: "Cover des O.D.I.N.-Grundregelwerks, zweite Edition: Bleistiftzeichnung einer Kompassrose auf altem Papier."
    alt_en: "Cover of the O.D.I.N. Core Rulebook, second edition: pencil drawing of a compass rose on aged paper."
  de:
    text: |
      Seit Jahrzehnten hält eine Organisation, die es offiziell nicht gibt, die Risse geschlossen. Keine Flagge, kein Hauptquartier.

      O.D.I.N. ist mein Pen-&-Paper-Rollenspiel über genau diese Leute. 15 Bücher, alle kostenlos.
    mehr: |
      Grundregelwerk, sechs Klassenbücher, Spielleiterbuch, Kampagne, Szenarioband, Ausrüstungsbuch, Schnellstart. Dazu ein Charaktergenerator im Browser und ein System für Foundry VTT. Ohne Anmeldung.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      For decades, an organisation that officially does not exist has kept the rifts closed. No flag, no headquarters on any map.

      O.D.I.N. is my tabletop RPG about the people who do that work. The whole line is free.
    mehr: |
      Core Rulebook, six class books, Game Master's Book, a campaign, a mission collection, an equipment book and a Quickstart. Plus a character generator in the browser and a full Foundry VTT system. No sign-up, just download.
    link: https://odin-rpg.pages.dev/en/

- id: w01-wuerfel
  tag: 2
  zeit: "18:00"
  bild:
    typ: zitat
    de: "Weiße Würfel für das Attribut: Erfolg bei 5 und 6.\nBunte Würfel für die Fertigkeit: Erfolg bei 4, 5 und 6."
    en: "White dice for the attribute: success on 5 or 6.\nColoured dice for the skill: success on 4, 5 or 6."
    quelle_de: "O.D.I.N. Grundregelwerk"
    quelle_en: "O.D.I.N. Core Rulebook"
    alt_de: "Texttafel im Schreibmaschinenstil: Weiße Würfel für das Attribut, Erfolg bei 5 und 6. Bunte Würfel für die Fertigkeit, Erfolg bei 4, 5 und 6."
    alt_en: "Typewriter-style text card: White dice for the attribute, success on 5 or 6. Coloured dice for the skill, success on 4, 5 or 6."
  de:
    text: |
      Das Würfelsystem von O.D.I.N. passt in zwei Zeilen: weiße W6 fürs Attribut treffen ab 5, bunte W6 für die Fertigkeit ab 4.

      Heißt am Tisch: Training ist verlässlicher als Talent. Das Naturtalent glänzt, der Ausgebildete liefert.
    mehr: |
      Wer eine Fertigkeit gar nicht beherrscht, würfelt nur weiß. Das spürt man sofort.
    link: https://odin-rpg.pages.dev/buecher.html
    tags: ["Spieldesign"]
  en:
    text: |
      The O.D.I.N. dice system fits in two lines: white d6 for the attribute hit on 5+, coloured d6 for the skill hit on 4+.

      At the table that means training beats talent. The natural shines, the trained agent delivers.
    mehr: |
      No skill at all? You roll white dice only, and you feel it immediately.
    link: https://odin-rpg.pages.dev/en/books.html
    tags: ["TTRPGDesign"]

- id: w01-schnellstart
  tag: 5
  zeit: "10:30"
  zeit_en: "17:00"
  bild:
    typ: foto
    datei: stausee_1.jpg
    zeile_de: "SCHNELLSTART · Das Haus am Stausee"
    zeile_en: "QUICKSTART · The House by the Reservoir"
    alt_de: "Ein altes Steinhaus auf einer kleinen Insel in einem nebligen Stausee, davor ein Holzsteg, auf dem vier Gestalten mit Laternen gehen."
    alt_en: "An old stone house on a small island in a misty reservoir, with a wooden jetty where four figures walk with lanterns."
  de:
    text: |
      Ein Abend, vier fertige Agenten, ein Einsatz: Das Haus am Stausee.

      Der Schnellstart von O.D.I.N. hat Welt und Kurzregeln auf wenigen Seiten. Drei bis vier Spieler, eine Spielleitung, acht weiße und acht bunte W6. Kostenlos.
    mehr: |
      Wer danach mehr will: Die Agenten lassen sich im Charaktergenerator nachbauen und in die Kampagne mitnehmen.
    link: https://odin-rpg.pages.dev/buecher.html
    tags: ["OneShot"]
  en:
    text: |
      One evening, four ready agents, one mission: The House by the Reservoir.

      The O.D.I.N. Quickstart gives you the world and the short rules in a few pages. Three to four players, one GM, eight white and eight coloured d6. Free.
    mehr: |
      If you want more afterwards, rebuild the agents in the character generator and take them into the campaign.
    link: https://odin-rpg.pages.dev/en/books.html
    tags: ["OneShot"]

