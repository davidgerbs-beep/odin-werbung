    alt_de: "Texttafel: Neu am O.D.I.N.-Spieltisch sind Granaten mit Radius, Zauber auf Flächen, ein Wurf je Ziel und Würfe im Discord-Kanal der Runde."
    alt_en: "Text card: new at the O.D.I.N. table are grenades with a radius, spells on areas, one roll per target and rolls in your group's Discord channel."
  de:
    text: |
      Am O.D.I.N.-Spieltisch trifft eine Granate jetzt alles im Radius. Die Spielleitung tippt auf die Mitte, der Tisch würfelt gegen jedes Ziel einzeln, Deckung schützt, Ausweichen halbiert den Schaden.
    mehr: |
      Kräfte und Zauber mit Fläche laufen genauso, mit eigener Animation. Neu ist auch der Draht zum Discord der Runde: Würfe, Runden und Treffer landen als kurze Zeile im Kanal, verdeckte Würfe und Geflüstertes nie. Im Browser, ohne Konto.
    link: https://odin-rpg.pages.dev/tisch/
    tags: ["VTT"]
  en:
    text: |
      At the O.D.I.N. table, a grenade now hits everything in its radius. The GM taps the centre, the table rolls against each target separately, cover protects, and dodging halves the damage.
    mehr: |
      Powers and spells with an area work the same way, each with its own animation. Also new: a line to your group's Discord. Rolls, rounds and hits show up as a short line in the channel, hidden rolls and whispers never. Still in the browser, no account.
    link: https://odin-rpg.pages.dev/tisch/?lang=en
    tags: ["VTT"]

- id: spieltisch-stufe-b
  datum: "2026-10-10"
  zeit: "18:30"
  zeit_en: "20:00"
  bild:
