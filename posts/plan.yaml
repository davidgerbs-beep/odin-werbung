    alt_de: "Cover von Horte der Welt: eine offene Stahltür gibt den Blick in einen langen, beleuchteten Bunkergang frei, in Sepia."
  de:
    text: |
      Kein Stützpunkt von O.D.I.N. beherbergt mehr als zwölf Agenten. Horte der Welt zeigt, wo sie liegen, unter welchen Städten und hinter welchen Türen.

      Der Regionalband, neu und kostenlos.
    link: https://odin-rpg.pages.dev/buecher.html

- id: w09-kostenlos
  tag: 61
  zeit: "10:30"
  zeit_en: "17:00"
  bild:
    typ: raster
    dateien: [klasse-psion.webp, klasse-thaumaturg.webp, klasse-soldier.webp, klasse-agent.webp, klasse-scientist.webp, klasse-investigator.webp]
    zeile_de: "Sechs Zweige. Kein Preisschild."
    zeile_en: "Six branches. No price tag."
    alt_de: "Raster aus sechs Sepia-Porträts, je eines für die sechs Klassen von O.D.I.N."
    alt_en: "Grid of six sepia portraits, one for each of the six O.D.I.N. classes."
  de:
    text: |
      Oft gefragt: warum ist O.D.I.N. kostenlos?

      Weil ich will, dass es gespielt wird. Wer trotzdem etwas zurückgeben möchte, findet auf der Seite einen PayPal-Link. Noch lieber ist mir ein Bericht von eurer Runde.
    link: https://odin-rpg.pages.dev/
  en:
    text: |
      People ask why O.D.I.N. is free.

      Because I want it played. If you'd like to give something back, there's a PayPal link on the site. A report from your table means even more to me.
    link: https://odin-rpg.pages.dev/en/

