    mehr: |
      Das Token hängt am Bogen. LP und Belastung stehen darunter, und „Kampf beginnen“ nimmt es gleich in die Zugreihenfolge. Ein zweiter Klick setzt kein Doppel. Nichts hochladen, nichts von Hand verbinden. Die Illustrationen sind KI-generiert.
