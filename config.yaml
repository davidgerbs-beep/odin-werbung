# Grundeinstellungen für die O.D.I.N.-Werbung
# Nach jeder Änderung: Datei speichern, committen, fertig.

# Erster Posting-Tag. Alle "tag:"-Angaben im Plan zählen ab hier.
start: "2026-09-23"

zeitzone: "Europe/Berlin"

# Standardzeit für englische Beiträge, wenn im Plan keine "zeit_en" steht
# (21:00 in Berlin = 15:00 New York = 12:00 Kalifornien)
zeit_en: "21:00"

# Beiträge, die mehr als so viele Stunden überfällig sind, werden übersprungen statt nachgeholt
max_verspaetung_stunden: 36

# Höchstens so viele Beiträge pro Kanal und Lauf (der Lauf ist stündlich)
max_pro_lauf: 1

# Öffentliche Adresse der Bilder (für Instagram, wird automatisch gesetzt, wenn leer)
# Beispiel: https://raw.githubusercontent.com/davidgerbs-beep/odin-werbung/main/bilder
bild_url: ""

# Einladungslink zum eigenen Discord-Server, sobald es ihn gibt (sonst leer lassen)
discord_einladung: "https://discord.gg/HVZu67uAZa"

# Welche Kanäle aktiv sind. Ein Kanal postet nur, wenn er hier true ist UND seine Zugangsdaten
# als GitHub-Secret hinterlegt sind.
kanaele:
  bluesky_de: true
  bluesky_en: true
  mastodon_de: true
  mastodon_en: true
  discord_de: true
  discord_en: true
  instagram: true
  threads: true
  tumblr: true

# Hashtags, die jeder Kanal anhängt (ohne #). Beitrags-Tags aus dem Plan kommen dazu.
tags:
  bluesky_de: ["pnpde", "Rollenspiel"]
  bluesky_en: ["TTRPG", "IndieTTRPG"]
  mastodon_de: ["pnpde", "Rollenspiel", "PenAndPaper"]
  mastodon_en: ["TTRPG", "IndieTTRPG", "FreeRPG"]
  tumblr: ["ttrpg", "indie ttrpg", "tabletop rpg", "free rpg", "rpg", "horror rpg", "occult", "tabletop games"]
  instagram: ["ttrpg", "indiettrpg", "pnpde", "rollenspiel", "penandpaper", "freerpg", "tabletoprpg", "occult", "ttrpgcommunity"]

# Hinweis auf KI-erzeugte Bilder. pnpde.social verlangt die Kennzeichnung.
# Pro Kanal: der Tag wird angehängt, sobald der Beitrag ein Bild hat.
ki_hinweis:
  mastodon_de: "KIgeneriert"

# Instagram bekommt ein Bild pro Beitrag in dieser Sprache, die Bildunterschrift enthält DE und EN
instagram_bildsprache: en

# Instagram als Reel posten, wenn neben dem Bild ein Video liegt (bilder/<id>_en.mp4, gebaut mit
# python werkzeug/reels.py). Fehlt das Video oder klappt das Reel nicht, wird das Bild gepostet.
instagram_reels: true

# Threads: Sprache der Beiträge und das eine Thema-Tag, das Threads pro Beitrag erlaubt
threads_sprache: en
threads_thema: TTRPG

# Tumblr: Blogname und Sprache der Beiträge
tumblr_blog: odin-rpg
tumblr_sprache: en
